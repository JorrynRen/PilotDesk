# 灵感市场索引自动生成
# 当 server/market/inspirations/ 目录下的灵感文件发生变更时，
# 自动重新生成 index.json 索引文件并提交到仓库。
#
# 目录结构:
#   server/market/inspirations/<id>/<id>.json   # { id, title, icon, content, tags? }
#   一条灵感一个目录（与工作流模板、插件同构）：平台侧停用/恢复可以整目录搬迁，
#   目录内也留出了放附件的位置。旧的扁平文件 <id>.json 不再收录，生成器会明确报出来。
#
# 索引文件位置: server/market/inspirations/index.json
#
# 注意：index.json 是**生成物**，不要在 PR 里手改它（会被下一次生成覆盖）。
# 要加/改一条灵感，请新建或编辑对应目录里的源文件。
# 其中 `id` 以**文件里的字段为准**（它是客户端判断"是否已导入"的依据），
# 目录名与文件名只是物理位置 —— 建议同名，不同名脚本会提示但不影响生成。
#
# 生成逻辑在 Node 脚本 server/scripts/generate-inspiration-index.mjs（本地可跑：npm run market:index:inspirations）。
# 本文件与 generate-plugin-index.yml / generate-workflow-index.yml 对称 —— 缺了它，
# 改了灵感却忘了重算索引时，客户端会一直拿到过期清单，而且没有任何提示。

name: Generate Inspiration Index

on:
  push:
    branches: [main]
    # 只在"真的可能影响索引"的路径变动时才跑，理由同 generate-plugin-index.yml
    # （过滤是为了省 CI 时间：内容没变时脚本本就不会产生提交）。
    paths:
      - 'server/market/inspirations/**'
      - 'server/scripts/generate-inspiration-index.mjs'
      - '.github/workflows/generate-inspiration-index.yml'
  workflow_dispatch:

# 本 workflow 有独立并发组，理由见 generate-plugin-index.yml —— 简言之：三个索引
# workflow 以前共用 market-index，而往同一个组里排新 run 会取消**排队中**的那一个，
# 于是"一次推送同时改到两个以上市场目录"必然挤掉一条，那个索引停在旧内容上。
concurrency:
  group: market-index-inspirations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 索引本身只读灵感文件，但下面的"变基到最新 main"需要公共祖先 —— 浅克隆里
      # 变基会因缺少 merge base 失败，所以这里同样要完整历史。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate index.json
        run: node server/scripts/generate-inspiration-index.mjs

      - name: Validate index.json
        run: |
          echo "Validating index.json..."
          if [ ! -f server/market/inspirations/index.json ]; then
            echo "Error: index.json not generated"
            exit 1
          fi
          if ! jq empty server/market/inspirations/index.json 2>/dev/null; then
            echo "Error: index.json is not valid JSON"
            exit 1
          fi
          echo "Index file size: $(wc -c < server/market/inspirations/index.json) bytes"
          echo "Inspiration count: $(jq '.inspirations | length' server/market/inspirations/index.json)"

      - name: Commit and push if changed
        run: |
          git config --local user.email "ren.jorryn@gmail.com"
          git config --local user.name "jorryn"
          git add server/market/inspirations/index.json
          if git diff --staged --quiet; then
            echo "No changes to index.json"
            exit 0
          fi
          git commit -m "chore(inspiration-market): auto-generate inspiration index [skip ci]"
          # 记下"本次生成的提交"：重试时要用它把变基结果退回来重来
          own_commit="$(git rev-parse HEAD)"

          # 三条索引流水线各有独立并发组、可以并行，于是"两个 workflow 几乎同时推 main"
          # 成为可能 —— 后推的那个会被判非快进。所以这里循环：fetch → 变基 → push，
          # 只有 push 被拒才算并发竞争，退回自己的提交再来一轮（详见 generate-plugin-index.yml）。
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # 变基冲突说明本次产物基于旧目录树（同一索引在 main 上已被更新），几乎总是
            # "重跑了历史 run"：Re-run 会 checkout 那一次的旧提交，产物基于旧树推上去只会
            # 让索引回退。不是代码问题，跳过并留一句人话。
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "::warning::跳过本次推送：本次生成基于 $(git rev-parse --short HEAD) 的目录树，而 main 上 index.json 已被更新。最常见的原因是「Re-run 了历史 run」——产物基于旧树，推上去只会把索引回退；请改用 Run workflow 在最新 main 上重新生成。若确认不是重跑，请再检查该索引是否被手工改过。"
              exit 0
            fi
            if git push; then
              echo "已推送（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "推送被并发抢先，退回本次提交后重试（第 ${attempt} 次）"
            git reset --hard "${own_commit}"
            sleep 3
          done
          echo "::error::连续 3 次推送均被拒；请到 Actions 手动 Run workflow 重试"
          exit 1
