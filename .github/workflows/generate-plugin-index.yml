# 插件商店索引自动生成
# 当 server/market/plugins/ 目录下的插件文件发生变更时，
# 自动重新生成 index.json 索引文件并提交到仓库。
#
# 目录结构:
#   server/market/plugins/<plugin-id>/<version>/
#     ├── manifest.json     # 插件清单（version 字段从此读取）
#     ├── index.js          # 插件入口
#     └── icon.png          # 插件图标（可选）
#
# 索引文件位置: server/market/plugins/plugins-index.json
#
# 生成逻辑在 Node 脚本 server/scripts/generate-plugin-index.mjs（本地可跑、可调试），
# 本 workflow 只负责在 CI 上调用它并提交产物 —— GitHub 规定 workflow 只能放在
# .github/workflows/，所以脚本搬走之后这个文件仍然必须存在（否则没人触发）。
#
# 文件名与脚本名对齐（generate-plugin-index.mjs ↔ generate-plugin-index.yml）；
# 工作流模板索引是它的姊妹文件 generate-workflow-index.yml。

name: Generate Plugin Index

on:
  push:
    branches: [main]
    # 只在"真的可能影响索引"的路径变动时才跑。
    #
    # 过滤是为了省 CI 时间，不是为了压提交 —— 内容没变时脚本本就不会产生提交
    # （顶层时间戳只在条目真的变化时才更新，见 generate-plugin-index.mjs 的 stableUpdatedAt）。
    # 生成逻辑住在下方脚本里，所以脚本自身的改动要触发；本文件自身的改动也保留触发一次。
    paths:
      - 'server/market/plugins/**'
      - 'server/scripts/generate-plugin-index.mjs'
      - '.github/workflows/generate-plugin-index.yml'
  workflow_dispatch:

# 与 generate-workflow-index.yml 共用同一个并发组：两者都会 `git push` 到 main，
# 放任并发必然出现"A 推成功、B 非快进被拒"的伪失败（今天就是这么被卡的）。
# 排队执行即可，不要取消在途运行 —— 取消会把该提交的半成品留在工作区外没人管。
concurrency:
  group: market-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 版本不可变校验要读 HEAD 上的旧索引（git show HEAD:...），需要完整历史
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate plugins-index.json
        run: node server/scripts/generate-plugin-index.mjs

      - name: Validate plugins-index.json
        run: |
          echo "Validating plugins-index.json..."
          if [ ! -f server/market/plugins/plugins-index.json ]; then
            echo "Error: plugins-index.json not generated"
            exit 1
          fi
          # 验证 JSON 格式
          if ! jq empty server/market/plugins/plugins-index.json 2>/dev/null; then
            echo "Error: plugins-index.json is not valid JSON"
            exit 1
          fi
          echo "Index file size: $(wc -c < server/market/plugins/plugins-index.json) bytes"
          echo "Plugin count: $(jq '.plugins | length' server/market/plugins/plugins-index.json)"

      - name: Commit and push if changed
        run: |
          git config --local user.email "ren.jorryn@gmail.com"
          git config --local user.name "jorryn"
          git add server/market/plugins/plugins-index.json
          if git diff --staged --quiet; then
            echo "No changes to plugins-index.json"
            exit 0
          fi
          git commit -m "chore(plugin-market): auto-generate plugin index [skip ci]"
          # 并发组只保证"同一时刻只有一个索引 workflow 在跑"，但排队启动的那一个
          # checkout 拿到的是**触发提交**（github.sha）而非最新 main —— 若前一个工作流
          # 刚推过自己的索引提交，这里直接 push 必然被拒（非快进），本文件就是这么失败过一次。
          # 先变基到最新 main 再推；两个索引改的是不同文件，正常竞争下 rebase 不会冲突。
          git fetch origin "${GITHUB_REF_NAME}"
          # 变基冲突说明**本次产物是基于旧目录树算出来的**（同一个索引文件在 main 上已被更新），
          # 根因几乎总是"重跑了历史 run"：GitHub 的 Re-run 会 checkout 那一次的旧提交，
          # 等于把几天前的产物往今天的 main 上放 —— 必然冲突，而且就算推上去也只会让索引回退。
          # 这不是代码问题，跳过并留一句人话，不要让它变成一条莫名其妙的红色流水线。
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            git rebase --abort
            echo "::warning::跳过本次推送：本次生成基于 $(git rev-parse --short HEAD) 的目录树，而 main 上 plugins-index.json 已被更新。最常见的原因是「Re-run 了历史 run」——产物基于旧树，推上去只会把索引回退；请改用 Run workflow 在最新 main 上重新生成。若确认不是重跑，请再检查该索引是否被手工改过。"
            exit 0
          fi
          git push
