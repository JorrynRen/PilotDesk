# 发布流水线：推送 v* tag（或手动触发）时构建三平台安装包并自动创建 GitHub Release
#
# 产出：
#   - Windows: NSIS 安装包 (.exe) + .sig
#   - macOS:   .app / .dmg + .app.tar.gz + .sig
#   - Linux:   .AppImage / .deb + .sig
#   - latest.json：供 tauri-plugin-updater 读取（app 内「检查更新」使用）
#
# ──────────────────────────────────────────────────────────────
# 一、必须在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置的 Secrets
# ──────────────────────────────────────────────────────────────
# 【不配就直接失败】
#   TAURI_SIGNING_PRIVATE_KEY            updater 签名私钥（三平台共用，updater 安装包签名）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   上面私钥的密码（生成时若留空则填空字符串）
#     ⌁ 生成方式（只需做一次，私钥务必离线备份，丢失后老用户将无法再收到更新）：
#         npm run tauri signer generate -- -w "$HOME/.tauri/pilotdesk.key"
#       命令会输出 private key 与 public key：
#         - private key 全文 → TAURI_SIGNING_PRIVATE_KEY
#           （也支持用 TAURI_SIGNING_PRIVATE_KEY_PATH 指向文件路径，这里统一用变量传全文）
#         - public key       → 粘贴进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey，
#                              替换当前的占位符 REPLACE_WITH_PUBLIC_KEY_FROM_TAURI_SIGNER_GENERATE
#
# 【仅 macOS 需要】
#   APPLE_CERTIFICATE              Developer ID Application 证书导出的 .p12 文件内容（base64）
#   APPLE_CERTIFICATE_PASSWORD     导出 .p12 时设置的密码
#   APPLE_SIGNING_IDENTITY         签名标识，形如 "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                       你的 Apple ID（用于公证 notarization）
#   APPLE_PASSWORD                 App 专用密码（appleid.apple.com 生成，非账号密码）
#   APPLE_TEAM_ID                  10 位 Team ID（developer.apple.com 账号页可见）
#     ⌁ 两个最常见的坑（配错时 macOS 构建会在 codesign 阶段只报一句
#       `SecKeychainItemImport: One or more parameters passed to a function were not valid.`，
#       信息量几乎为零）：
#       1) 粘进去的不是 .p12 的 base64 —— 例如贴了 .pem/.cer 文本，或 base64 里带了换行
#          （必须是**单行**）
#       2) 密码与"导出 .p12 时设的密码"不一致（注意别与钥匙串登录密码混淆）；
#          也有可能是 .p12 的加密算法不为 macOS `security import` 支持，
#          此时用兼容算法重新导出：openssl pkcs12 -export -legacy -out cert.p12 -inkey k.pem -in c.pem
#       preflight 会提前校验，且**证书不可用时只跳过 macOS 构建、不阻塞整条发布**
#       （Windows/Linux 照常发出去）；证书配好后 macOS 会自动回到构建矩阵里，无需改代码。
#     ⌁ 证书导出：钥匙串访问 → 我的证书 → 选中 Developer ID Application 证书
#       → 右键导出 → 文件格式 .p12 → 设置密码 → 然后 base64 编码：
#         macOS/Linux: base64 -i cert.p12 | pbcopy
#         Windows:     [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.p12"))
#
# 【仅 Windows 需要（代码签名，可选）】
#   注意：Windows「代码签名」（Authenticode，消除 SmartScreen 警告）与上面的 updater 签名是
#   两件不同的事——TAURI_SIGNING_PRIVATE_KEY 只用于 updater 校验，不会给 exe 打 Authenticode 签名。
#   若拿到代码签名证书，按所用方式二选一：
#     a) 证书已装进构建机的 Windows 证书存储：
#          TAURI_WINDOWS_SIGNTOOL_THUMBPRINT   证书指纹
#          TAURI_WINDOWS_SIGNTOOL_DIGEST_ALGORITHM  默认 sha256
#     b) Azure Trusted Signing（云签名，2023 后新证书多为此）：
#          AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#          AZURE_CODE_SIGNING_ACCOUNT_NAME / AZURE_CERTIFICATE_PROFILE_NAME
#          AZURE_CODE_SIGNING_ENDPOINT
#     c) 其他方式：在 tauri.conf.json 的 bundle.windows.signCommand 里配置自定义签名命令。
# ──────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传资产
permissions:
  contents: write

jobs:
  # 发布前置门禁：直接复用 ci.yml（tsc / eslint / build / fmt / check / test）
  ci:
    uses: ./.github/workflows/ci.yml

  # 发布前置守卫：把"配错了、但要等到用户端才发现"的问题挡在这里。
  preflight:
    name: 发布前置守卫（updater 密钥 / tag 版本一致性 / macOS 证书）
    runs-on: ubuntu-latest
    outputs:
      # 证书可用性（供日志与摘要阅读）
      apple_ok: ${{ steps.applecert.outputs.apple_ok }}
      # 实际的构建矩阵：证书不可用时其中不含 macOS
      matrix: ${{ steps.buildmatrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 公钥没替换时：构建会成功、latest.json 也会生成，但用户端是
      # "能查到更新 → 下载 → 签名校验失败 → 装不上"，而且没有任何线索。
      # 与其发一个装不了更新的包，不如在这里直接拦住。
      - name: 校验 updater 公钥已替换占位符
        run: |
          if grep -q 'REPLACE_WITH_PUBLIC_KEY_FROM_TAURI_SIGNER_GENERATE' src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json 的 plugins.updater.pubkey 仍是占位符，请按本文件顶部说明生成密钥并替换后再发布。"
            exit 1
          fi

      # secret 在 if 条件里不可直接引用，用 env 中转再判断。
      - name: 校验 updater 私钥已配置
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY（updater 签名私钥），见本文件顶部说明。"
            exit 1
          fi

      # tag 必须与 tauri.conf.json 的版本号一致：tauri-action 的 tagName 是 `v__VERSION__`
      # （由配置里的 version 推导），不一致时它会**另外创建一个 tag** —— Release 页面于是
      # 出现两个版本，而且和你以为发的不是同一个。
      - name: 校验 tag 与 tauri.conf.json 版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP '"version"\s*:\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
          # 解析失败时只告警不拦截：宁可放过，也不能因为守卫自己有 bug 而挡住正常发版。
          if [ -z "$VERSION" ]; then
            echo "::warning::未能从 tauri.conf.json 解析出 version，跳过 tag 一致性校验。"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag（$GITHUB_REF_NAME）与 tauri.conf.json 的 version（$VERSION）不一致。请改用 v$VERSION 这个 tag，或把版本号改成 $TAG 后重新提交再打 tag。"
            exit 1
          fi
          echo "tag 与版本号一致：v$VERSION"

      # macOS 证书是整条流水线里最容易配错、又最难排查的一环：配错时要等十几分钟把
      # Rust 依赖树编完，才会在 codesign 阶段报一句
      # `SecKeychainItemImport: One or more parameters passed to a function were not valid.`
      # （信息量为零）。
      #
      # 这里不只提前校验，还把结果写进 `apple_ok` 输出，交给 release job 决定要不要构建 macOS：
      #   证书可用       → 正常构建（签名 + 公证）
      #   证书缺失/不可用 → **跳过 macOS，其余平台照常发布**（失败的是"少一个平台"，不是整条发布）
      # 这样证书没配好时不会阻塞发版；将来证书配好了，macOS 会自动回到矩阵里，无需改动代码。
      - id: applecert
        name: 校验 macOS 代码签名证书（结果决定是否构建 macOS）
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          ok=false

          if [ -z "$CERT" ]; then
            echo "::warning::未配置 APPLE_CERTIFICATE —— 本次跳过 macOS 构建（Windows/Linux 不受影响）。"
          elif ! printf '%s' "$CERT" | base64 -d > /tmp/cert.p12 2>/dev/null; then
            echo "::warning::APPLE_CERTIFICATE 不是合法 base64（应当是 .p12 的**单行** base64，而不是 .pem/.cer 文本）—— 本次跳过 macOS 构建。"
          elif ! openssl pkcs12 -in /tmp/cert.p12 -passin pass:"$PW" -nokeys -noout 2>/dev/null \
            && ! openssl pkcs12 -legacy -in /tmp/cert.p12 -passin pass:"$PW" -nokeys -noout 2>/dev/null; then
            # OpenSSL 3 读旧算法的 p12 需要 -legacy，所以两条都试；都失败才是真有问题。
            echo "::warning::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD 无法解析该 .p12 —— 要么密码不对，要么 .p12 用了 macOS security import 不支持的加密算法（可用 openssl pkcs12 -export -legacy 重新导出）—— 本次跳过 macOS 构建。"
          else
            ok=true
            echo "证书可用：base64 解码成功，PKCS#12 与密码均校验通过。"
          fi

          echo "apple_ok=$ok" >> "$GITHUB_OUTPUT"
          {
            echo "### macOS 构建：$([ "$ok" = true ] && echo '将执行（证书可用）' || echo '已跳过（证书不可用）')"
            echo ""
            echo "证书的获取与导出步骤见本文件顶部【仅 macOS 需要】一节。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 由证书校验结果决定构建矩阵：证书不可用就**把 macOS 从矩阵里删掉**，
      # 而不是建一个注定失败的 job。
      #
      # ⚠️ 别改回"job 级 if + matrix"：GitHub 的上下文可用性表里，jobs.<id>.if 只认
      #    github / needs / vars / inputs —— **没有 matrix**。一旦在那里写 matrix.platform，
      #    整个 workflow 会被判定 `Invalid workflow file: Unrecognized named-value: 'matrix'`，
      #    连 job 都建不出来（而且这种错误本地 YAML 解析查不出来，只有 GitHub 侧会报）。
      - id: buildmatrix
        name: 生成构建矩阵（证书不可用则不含 macOS）
        env:
          APPLE_OK: ${{ steps.applecert.outputs.apple_ok }}
        run: |
          # Windows 上 updater 只支持 NSIS 安装包，故显式只打 nsis（同时避免 msi 混淆 latest.json）
          win='{"platform":"windows-latest","args":"--bundles nsis"}'
          # macOS 上 updater 使用 .app.tar.gz，dmg 供用户手动下载
          mac='{"platform":"macos-latest","args":"--bundles app,dmg"}'
          # Linux 上 updater 使用 AppImage，deb 供用户手动下载
          lin='{"platform":"ubuntu-22.04","args":"--bundles appimage,deb"}'

          if [ "$APPLE_OK" = "true" ]; then
            echo "matrix={\"include\":[${win},${mac},${lin}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${win},${lin}]}" >> "$GITHUB_OUTPUT"
            echo "::warning::证书不可用，本次构建矩阵不含 macOS。"
          fi

  release:
    name: 构建并发布 (${{ matrix.platform }})
    needs: [ci, preflight]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 矩阵由 preflight 输出：证书不可用时其中不含 macOS
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖 (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖 (npm ci)
        run: npm ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── updater 签名（三平台共用；对应 tauri.conf.json 的 plugins.updater.pubkey）──
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # ── macOS 代码签名 + 公证（非 macOS 上留空即被忽略）──
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # ── Windows 代码签名（可选，未配置会自动跳过）──
          # 证书存储在构建机证书库里时使用：
          TAURI_WINDOWS_SIGNTOOL_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_SIGNTOOL_THUMBPRINT }}
          # Azure Trusted Signing 时改用下面这组：
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          # AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          # AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
        with:
          # __VERSION__ 会被 tauri-action 替换为 src-tauri/tauri.conf.json 里的 version，
          # 因此 tag 会固定为 v<version>。发版前务必先同步版本号（见 README「发布流程」）。
          tagName: v__VERSION__
          releaseName: 'PilotDesk v__VERSION__'
          releaseBody: '下载对应平台安装包即可。支持应用内自动更新（设置 → 关于/更新检查）。'
          # 必须发布为正式 Release（非 draft/prerelease），否则
          # releases/latest/download/latest.json 无法解析，app 内自动更新会失效。
          releaseDraft: false
          prerelease: false
          # latest.json（updater 清单）由 tauri-action 默认生成并上传，多平台 job 会自动合并各平台条目
          args: ${{ matrix.args }}
